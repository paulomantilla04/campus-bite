# CampusBite API Gateway
# Copiado a /etc/nginx/conf.d/default.conf (incluido dentro de http {} en nginx:1.27-alpine).

# Reutiliza el X-Correlation-Id del cliente o genera uno nuevo por petición.
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      "corr-$request_id";
}

server {
    listen 80;
    server_name _;

    # DNS embebido de Docker + proxy_pass con variables: los upstreams se resuelven
    # en cada petición, así Nginx arranca aunque un microservicio esté parado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    add_header X-Correlation-Id $correlation_id always;

    # Evita duplicar la cabecera si el upstream también la devuelve.
    proxy_hide_header X-Correlation-Id;

    proxy_connect_timeout 3s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    # Upstream caído / no resoluble -> JSON 503 en vez de la página HTML de Nginx.
    error_page 502 503 504 = @upstream_unavailable;

    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"El microservicio no está disponible","correlationId":"$correlation_id"}';
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"service":"api-gateway","status":"healthy"}';
    }

    location /api/menu/ {
        set $menu_upstream http://menu-service:3001;
        rewrite ^/api/menu/(.*)$ /$1 break;
        proxy_pass $menu_upstream;
    }

    location /api/orders/ {
        set $orders_upstream http://orders-service:3002;
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass $orders_upstream;
    }

    # Server-Sent Events: sin buffering y con timeouts largos.
    location = /api/notifications/stream {
        set $notifications_upstream http://notifications-service:3003;
        proxy_pass $notifications_upstream/notifications/stream$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $correlation_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/notifications/ {
        set $notifications_upstream http://notifications-service:3003;
        rewrite ^/api/notifications/(.*)$ /$1 break;
        proxy_pass $notifications_upstream;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
