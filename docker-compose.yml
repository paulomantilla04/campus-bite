# CampusBite – stack de microservicios (Dokploy-ready: sin container_name).
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cafeteria}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-cafeteria}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cafeteria-net
    restart: unless-stopped
    mem_limit: 256m

  menu-service:
    build: ./services/menu-service
    environment:
      PORT: "3001"
      DB_PATH: /data/menu.db
    volumes:
      - menu_data:/data
    networks:
      - cafeteria-net
    restart: unless-stopped
    mem_limit: 128m

  orders-service:
    build: ./services/orders-service
    environment:
      PORT: "3002"
      DB_PATH: /data/orders.db
      MENU_SERVICE_URL: http://menu-service:3001
      MENU_TIMEOUT_MS: "3000"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cafeteria}:${RABBITMQ_PASS:-cafeteria}@rabbitmq:5672
    volumes:
      - orders_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      menu-service:
        condition: service_started
    networks:
      - cafeteria-net
    restart: unless-stopped
    mem_limit: 128m

  notifications-service:
    build: ./services/notifications-service
    environment:
      PORT: "3003"
      DB_PATH: /data/notifications.db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cafeteria}:${RABBITMQ_PASS:-cafeteria}@rabbitmq:5672
    volumes:
      - notifications_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - cafeteria-net
    restart: unless-stopped
    mem_limit: 128m

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - menu-service
      - orders-service
      - notifications-service
    networks:
      - cafeteria-net
    restart: unless-stopped
    mem_limit: 64m

networks:
  cafeteria-net:
    driver: bridge

volumes:
  rabbitmq_data:
  menu_data:
  orders_data:
  notifications_data:
